[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in pycbas/__init__.py so that `pycbas.__version__` is always
# correct, including from a source checkout or a stale editable install. Reading it
# the other way round reports whatever was last installed, which is misleading now
# that a release can change numerical output.
[tool.hatch.version]
path = "pycbas/__init__.py"

[project]
name = "pycbas"
dynamic = ["version"]
description = "Choice-Wide Behavioral Association Study — identify behavioral sequences that differ between groups or correlate with continuous measures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Demetris Roumis" },
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.59",
]

[project.optional-dependencies]
gui = [
    "panel>=1.4",
    "holoviews>=1.18",
    "bokeh>=3.3",
    "pandas>=2.0",
]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scipy>=1.11",
    # The GUI extra, because tests/test_app.py skips itself without panel. Left out,
    # CI reported a green suite while silently omitting every test of the app, which
    # is where the faults 0.2.0 fixes had been living undetected.
    "pycbas[gui]",
]

[project.scripts]
pycbas = "pycbas.cli:main"

[project.urls]
Repository = "https://github.com/droumis/pycbas"

[tool.hatch.build.targets.sdist]
include = ["/pycbas", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["pycbas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
