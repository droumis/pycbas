[workspace]
name = "pycbas"
version = "0.1.0"
description = "Choice-Wide Behavioral Association Study"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.11"
numpy = ">=1.24"
pytest = ">=7"
matplotlib = ">=3.7"
numba = ">=0.59"
pandas = ">=2.0"
scipy = ">=1.11"
hvplot = ">=0.9"
jupyterlab = ">=4.6.2,<5"
pip = ">=26.1.2,<27"
hatchling = ">=1.21"

[tasks]
install = "pip install -e . --no-deps --no-build-isolation"
test = { cmd = "python -m pytest tests/test_cbas.py -v", depends-on = ["install"] }

validate = "python scripts/validate.py"
figures = "python scripts/validate.py --figures-only"
validate-paper = "python scripts/validate.py --paper-params"
figures-paper = "python scripts/validate.py --figures-only --paper-params"
benchmark = "python scripts/benchmark.py"
benchmark-quick = "python scripts/benchmark.py --quick"
flies = "python scripts/run_flies.py"
flies-quick = "python scripts/run_flies.py --quick"
flies-subsample = "python scripts/run_flies_subsample.py"
human = "python scripts/run_human.py"
human-quick = "python scripts/run_human.py --quick"
rats = "python scripts/run_rats.py"
rats-quick = "python scripts/run_rats.py --quick"
noel-ibl = "python scripts/run_noel_ibl.py"
noel-ibl-quick = "python scripts/run_noel_ibl.py --quick"
noel-ibl-l8 = "python scripts/run_noel_ibl.py --seq-len 8"
noel-ibl-zero = "python scripts/run_noel_ibl_zero_contrast.py"
noel-ibl-zero-quick = "python scripts/run_noel_ibl_zero_contrast.py --quick --skip-surrogates"
noel-ibl-ctrl = "python scripts/run_noel_ibl_controlled.py"
noel-ibl-ctrl-quick = "python scripts/run_noel_ibl_controlled.py --quick"
noel-ibl-toward = "python scripts/run_noel_ibl_toward.py"
noel-ibl-toward-quick = "python scripts/run_noel_ibl_toward.py --quick"
sensitivity = "python scripts/sensitivity_analysis.py"
comparison-figs = "python scripts/comparison_figures.py"
reports = "python scripts/generate_reports.py"
