site_name: pycbas
site_description: Choice-Wide Behavioral Association Study
site_url: https://droumis.github.io/pycbas/
repo_url: https://github.com/droumis/pycbas
repo_name: droumis/pycbas

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Interactive App: app.md
  - Walkthrough (Comparative): walkthrough.md
  - Walkthrough (Correlative): walkthrough-correlative.md
  - User Guide: guide.md
  - Algorithm: algorithm.md
  - API Reference: api.md
  - Validation: validation.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - admonition

extra:
  generator: false
