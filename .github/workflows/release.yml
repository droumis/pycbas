name: release

# Publishing is driven by a version tag, so the released artifact is always tied to a
# specific commit and the act of releasing is recorded in the repository rather than in
# someone's shell history.
#
# Uploading to PyPI is irreversible: a version number can never be reused, even after a
# deletion. So the artifact is built once, checked, installed from, and only then
# published, with a human approval in between.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  # Build and install on pull requests too, so a change that breaks packaging fails
  # then rather than at the moment of release. The publishing jobs are gated on a tag.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Denied by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # ci.yml runs on pushes to main, which a tag push does not match, so the suite is
      # run again here against the exact commit being released.
      - name: Test
        run: pytest tests/ -q --durations=5

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      # The version is written in pycbas/__init__.py rather than derived from the tag,
      # so the two can disagree, and a disagreement would publish a version nobody
      # asked for under a tag that documents something else. Compare against the built
      # filenames, which is what actually gets uploaded.
      - name: Tag must match the built version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import glob, os, re, sys
          tag = os.environ["TAG"]
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"::error::expected one wheel, found {wheels}")
          built = re.match(r"pycbas-([^-]+)-", os.path.basename(wheels[0])).group(1)
          if tag != f"v{built}":
              sys.exit(f"::error::tag {tag} does not match built version {built}. "
                       f"Update __version__ in pycbas/__init__.py, or retag.")
          print(f"tag {tag} matches built version {built}")
          PY

      # A last check that the distribution carries the package and nothing else. This
      # repository sits next to unpublished data belonging to collaborators, and
      # .gitignore is the only thing keeping it out of a build; an sdist that suddenly
      # grew a data directory should stop the release rather than reach PyPI, where it
      # could not be taken back.
      - name: Distribution contains the package and nothing else
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile
          problems = []

          allowed_root = {"pycbas", "pyproject.toml", "README.md", "LICENSE",
                          "PKG-INFO", ".gitignore"}

          sdist, = glob.glob("dist/*.tar.gz")
          with tarfile.open(sdist) as tf:
              names = tf.getnames()
          for name in names:
              parts = name.split("/")
              if len(parts) < 2 or not parts[1]:
                  continue
              if parts[1] not in allowed_root:
                  problems.append(f"sdist: unexpected {name}")
              if parts[1] == "pycbas" and len(parts) > 2:
                  if not parts[-1].endswith((".py", "")):
                      problems.append(f"sdist: non-source file {name}")

          wheel, = glob.glob("dist/*.whl")
          for name in zipfile.ZipFile(wheel).namelist():
              top = name.split("/")[0]
              if top == "pycbas":
                  if not name.endswith(".py"):
                      problems.append(f"wheel: non-source file {name}")
              elif not top.endswith(".dist-info"):
                  problems.append(f"wheel: unexpected {name}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"sdist: {len(names)} entries, wheel: clean")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    name: Install ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Both forms are installed from, because the sdist is built from an explicit
      # allowlist and could omit something the wheel happens to carry.
      - name: Install from the ${{ matrix.artifact }}
        run: |
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            pip install dist/*.whl
          else
            pip install dist/*.tar.gz
          fi
      # Deliberately in a directory with no source tree, so a passing import cannot be
      # satisfied by the checkout instead of the installed package.
      - name: Import and run the CLI
        run: |
          cd "$(mktemp -d)"
          python -c "import pycbas; print(pycbas.__version__)"
          pycbas --version
          python -m pycbas --version

  waiting_room:
    name: Waiting room
    runs-on: ubuntu-latest
    needs: [test, build, install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # A GitHub environment, so this can require a reviewer. It is the last point at
    # which a release can be stopped.
    environment:
      name: publish
      url: https://pypi.org/p/pycbas
    steps:
      - run: echo "Tests, build and install checks have passed; approved to publish."

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, waiting_room]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: publish
      url: https://pypi.org/p/pycbas
    permissions:
      # Trusted publishing: PyPI verifies a short-lived OIDC token from this workflow,
      # so there is no long-lived API token to store as a secret or to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish the artifact built above
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github_release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [build, waiting_room]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The changelog is the release notes, so the two cannot drift. Only the lead
      # paragraph is taken -- everything between the version heading and the first
      # subsection -- with a link to the full section, because a release page nobody
      # scrolls to the end of is not release notes.
      - name: Extract this version's changelog lead
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            awk -v ver="## ${TAG#v}" '
              $0 == ver {flag=1; next}
              /^#+ / && flag {exit}
              flag
            ' CHANGELOG.md
            echo
            echo "Full notes: [CHANGELOG.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)"
          } > RELEASE_BODY.md
          # A version with no changelog section is a release nobody wrote notes for.
          grep -q '[^[:space:]]' <(awk -v ver="## ${TAG#v}" '
              $0 == ver {flag=1; next} /^#+ / && flag {exit} flag' CHANGELOG.md) || {
            echo "::error::no '## ${TAG#v}' section in CHANGELOG.md"; exit 1; }
          cat RELEASE_BODY.md
      # Draft, not published: the notes are worth reading before they are announced.
      - name: Create a draft release with the artifacts attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "pycbas ${TAG#v}" \
            --notes-file RELEASE_BODY.md \
            --draft \
            dist/*

  result:
    name: result:release
    needs: [test, build, install, publish, github_release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "a release job failed" && exit 1
